<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="ad.size" content="width=300,height=600" />
    <title>Banner 300x600</title>
    <style>
      :root {
        --banner-width: 300px;
        --banner-height: 600px;

        --canvas-shade-width: calc(100% - (20 / 600 * var(--banner-height) * 2));
        --canvas-shade-height: 100%;

        --text-top: 20%;
        --text-left: 50%;
        --text-font-size: 42px;

        --fuel-gun-bottom: 0;
        --fuel-gun-right: 10%;
        --fuel-gun-width: 25%;

        --logo-top: 7.5%;
        --logo-left: 50%;
        --logo-width: 60%;

        --divider-top: 25%;
        --divider-left: 50%;
        --divider-width: 25%;
        --divider-height: 5px;
        --divider-appear-width: 67.5%;

        --divisions-top: 15px;
        --divisions-left: 0;
        --divisions-width: 100%;
        --divisions-height: 5px;
        --division-width: 1px;
        --division-height: 100%;

        --clicker-height: 25%;
        --hint-cursor-height: 32.5%;
        --hint-cursor-margin-bottom: 5%;
        --text-hint-font-size: 16px;

        --packshot-reveal-clip: polygon(0% 0%, 100% 0%, 100% 62.5%, 0% 57.5%);
        --button-top: 45%;
        --button-font-size: 16px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "GPN_DIN_Condensed", Arial, sans-serif;
        overflow: hidden;
      }

      .banner {
        width: var(--banner-width);
        height: var(--banner-height);
        position: relative;
        background: linear-gradient(to top, #322b28 0%, #000000 85%);
        overflow: hidden;
      }

      #gameCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      .canvas-shade {
        width: var(--canvas-shade-width);
        height: var(--canvas-shade-height);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: linear-gradient(to top, #322b2800 0%, #00000066 85%);
      }

      .text {
        position: absolute;
        top: var(--text-top);
        left: var(--text-left);
        transform: translateX(-50%);
        color: white;
        font-family: "GPN_DIN_Condensed", Arial, sans-serif;
        font-size: var(--text-font-size);
        font-weight: normal;
        text-align: center;
        text-transform: uppercase;
        line-height: 1;
        opacity: 0;
        text-wrap: nowrap;
      }

      .fuel-gun {
        position: absolute;
        bottom: var(--fuel-gun-bottom);
        right: var(--fuel-gun-right);
        width: var(--fuel-gun-width);
        height: auto;
        transform: translateY(100%) scale(1);
        transition: all 1s cubic-bezier(0.3, 0, 0.1, 1);
      }

      .logo-color,
      .logo-white {
        position: absolute;
        top: var(--logo-top);
        left: var(--logo-left);
        transform: translateX(-50%) scale(0.75);
        width: var(--logo-width);
        height: auto;
        opacity: 0;
        transition: opacity 1s cubic-bezier(0.3, 0, 0.1, 1),
          transform 1s cubic-bezier(0.3, 0, 0.1, 1);
      }

      .logo-white {
        transform: translateX(-50%) scale(1) !important;
        opacity: 1 !important;
      }

      .divider {
        position: absolute;
        top: var(--divider-top);
        left: var(--divider-left);
        transform: translateX(-50%);
        width: var(--divider-width);
        height: var(--divider-height);
        background-color: white;
        border-radius: 5px;
        opacity: 0;
        transition: all 1s cubic-bezier(0.3, 0, 0.1, 1);
      }

      .divider-color {
        top: 0%;
        left: 0%;
        width: 0%;
        height: 100%;
        background-color: #ff732a !important;
        border-radius: 5px;
        transition: all 0.5s cubic-bezier(0.3, 0, 0.1, 1);
      }

      .divider-color-25 {
        width: 25% !important;
      }
      .divider-color-50 {
        width: 50% !important;
      }
      .divider-color-75 {
        width: 75% !important;
      }
      .divider-color-100 {
        width: 100% !important;
      }

      .divisions {
        display: flex;
        position: absolute;
        top: var(--divisions-top);
        left: var(--divisions-left);
        width: var(--divisions-width);
        height: var(--divisions-height);
        flex-direction: row;
        align-content: center;
        justify-content: space-between;
      }

      .division {
        width: var(--division-width);
        height: var(--division-height);
        background-color: white;
        border-radius: 5px;
      }

      .clicker-area {
        display: none;
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
      }

      .clicker {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: var(--clicker-height);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: all 1s ease-in-out;
      }

      .hint-cursor {
        width: auto;
        height: var(--hint-cursor-height);
        position: relative;
        margin-bottom: var(--hint-cursor-margin-bottom);
      }

      .hint-cursor img:nth-child(1),
      .hint-cursor img:nth-child(2),
      .hint-cursor img:nth-child(3) {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: auto;
        height: 100%;
      }

      .hint-cursor img:nth-child(1) {
        z-index: 1;
      }
      .hint-cursor img:nth-child(2) {
        z-index: 2;
      }
      .hint-cursor img:nth-child(3) {
        z-index: 3;
      }

      .text-hint {
        position: relative;
        color: white;
        font-family: "GPN_DIN_Condensed", Arial, sans-serif;
        font-size: var(--text-hint-font-size);
        font-weight: normal;
        text-align: center;
        text-transform: uppercase;
        line-height: 1;
        text-wrap: nowrap;
      }

      .packshot {
        display: none;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: #e05206;
        clip-path: polygon(0% 0%, 100% 0%, 100% 0%, 0% 0%);
        transition: clip-path 1.5s cubic-bezier(0.3, 0, 0.1, 1);
      }

      .packshot-appear {
        display: block !important;
      }

      .packshot-reveal {
        clip-path: var(--packshot-reveal-clip) !important;
      }

      .button {
        position: absolute;
        top: var(--button-top);
        left: 50%;
        transform: translateX(-50%) scale(0.75);
        background-color: white;
        color: #e05206;
        padding: 1em 3em;
        border-radius: 2em;
        font-family: "GPN_DIN_Condensed", Arial, sans-serif;
        font-size: var(--button-font-size);
        cursor: pointer;
        text-transform: uppercase;
        opacity: 0;
        transition: all 1s cubic-bezier(0.3, 0, 0.1, 1);
      }

      .text-appear {
        animation: textAppear 1s cubic-bezier(0.3, 0, 0.1, 1) forwards;
      }

      .text-disappear {
        animation: textDisappear 1s cubic-bezier(0.3, 0, 0.1, 1) forwards;
      }

      .text-disappear-scale {
        animation: textDisappearScale 1s cubic-bezier(0.3, 0, 0.1, 1) forwards;
      }

      @keyframes textAppear {
        0% {
          opacity: 0;
          transform: translateX(-50%) translateY(75%);
        }
        100% {
          opacity: 1;
          transform: translateX(-50%) translateY(0%);
        }
      }

      @keyframes textDisappear {
        0% {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(-50%);
        }
      }

      @keyframes textDisappearScale {
        0% {
          opacity: 1;
          transform: translateX(-50%) translateY(0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(0) scale(0.75);
        }
      }

      .fuel-gun-appear {
        animation: fuelGunAppear 1s cubic-bezier(0.3, 0, 0.1, 1) forwards,
          fuelGunPulse 0.875s ease-in-out infinite 1s;
      }

      .fuel-gun-disappear {
        animation: fuelGunDisappear 1s cubic-bezier(0.3, 0, 0.1, 1) forwards;
      }

      @keyframes fuelGunAppear {
        0% {
          transform: translateY(100%) scale(1);
        }
        100% {
          transform: translateY(0%) scale(1);
        }
      }

      @keyframes fuelGunPulse {
        0% {
          transform: translateY(0%) scale(1);
        }
        50% {
          transform: translateY(0%) scale(1.075);
        }
        100% {
          transform: translateY(0%) scale(1);
        }
      }

      @keyframes fuelGunDisappear {
        0% {
          transform: translateY(0%);
        }
        100% {
          transform: translateY(100%);
        }
      }

      .logo-appear {
        transform: translateX(-50%) scale(1) !important;
        opacity: 1 !important;
      }

      .divider-appear {
        opacity: 1 !important;
        width: var(--divider-appear-width) !important;
      }

      .divider-disappear {
        opacity: 0 !important;
      }

      .clicker-area-appear {
        display: block !important;
      }

      .clicker-appear {
        opacity: 1 !important;
      }

      @keyframes hint-cursor-scale {
        0% {
          transform: translateX(-50%) scale(1);
        }
        33.333% {
          transform: translateX(-50%) scale(0.75);
        }
        100% {
          transform: translateX(-50%) scale(1);
        }
      }

      @keyframes hint-cursor-opacity {
        0% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      .hint-cursor img:nth-child(1) {
        animation: hint-cursor-scale 1.25s cubic-bezier(0.3, 0, 0.1, 1) infinite;
        transform-origin: center;
      }

      .hint-cursor img:nth-child(2) {
        animation: hint-cursor-opacity 0.75s linear infinite;
      }

      .hint-cursor img:nth-child(3) {
        animation: hint-cursor-opacity 0.75s linear infinite;
        animation-delay: 0.25s;
      }

      .packshot-appear {
        display: block !important;
      }

      .button-appear {
        opacity: 1 !important;
        transform: translateX(-50%) scale(1);
        animation: buttonPulse 1.25s ease-in-out infinite 1s;
      }

      @keyframes buttonPulse {
        0% {
          transform: translateX(-50%) scale(1);
        }
        50% {
          transform: translateX(-50%) scale(1.1);
        }
        100% {
          transform: translateX(-50%) scale(1);
        }
      }
    </style>

    <script>
      var clickTag = "https://gpn-promo.ru/";
    </script>
  </head>
  <body>
    <div class="banner">
      <canvas id="gameCanvas"></canvas>
      <div class="canvas-shade"></div>

      <div class="text" id="text1">Не хватает<br />мощности?</div>
      <div class="text" id="text2">Пора<br />заправиться!</div>

      <img src="assets/fuel_gun.png" alt="Fuel Gun" class="fuel-gun" id="fuelGun" />
      <img src="assets/logo_color.png" alt="Logo" class="logo-color" id="logoColor" />

      <div class="divider" id="divider">
        <div class="divider-color" id="dividerColor"></div>
        <div class="divisions" id="divisions">
          <div class="division"></div>
          <div class="division"></div>
          <div class="division"></div>
          <div class="division"></div>
          <div class="division"></div>
        </div>
      </div>

      <div class="clicker-area" id="clickerArea">
        <div class="clicker" id="clicker">
          <div class="hint-cursor">
            <img src="assets/hint_cursor_1.svg" />
            <img src="assets/hint_cursor_2.svg" />
            <img src="assets/hint_cursor_3.svg" />
          </div>
          <div class="text-hint">Кликай на топливо<br />G-drive</div>
        </div>
      </div>

      <div class="packshot" id="packshot">
        <img
          src="assets/logo_white.png"
          alt="Logo"
          class="logo-white"
          id="logoWhite"
        />
        <div class="text" id="text3">
          Проверено<br />в гоночных<br />условиях
        </div>
        <a href="javascript:void(window.open(window.clickTag))">
          <div class="button" id="button">Подробнее</div>
        </a>
      </div>
    </div>

    <script>
      class CanvasGame {
        constructor() {
          this.canvas = document.getElementById("gameCanvas");
          this.ctx = this.canvas.getContext("2d");

          this.updateCanvasSize();

          this.startTime = Date.now();
          this.gameDuration = 6000;
          this.isGameActive = true;
          this.isReverseActive = false;
          this.reverseAnimationStartTime = 0;

          this.roadLineWidth = (20 / 600) * this.height;
          this.roadLineHeight = this.height;
          this.roadLineSpeed = 2.5;
          this.roadLineOffset = 0;
          this.isSpeedAnimating = false;
          this.speedAnimationStartTime = 0;
          this.initialSpeed = 2.5;
          this.targetSpeed = 5;

          this.cars = [];
          this.carHeight = this.height / 4;
          this.carSplashHeight = this.height / 12;
          this.carSpeed = this.height / (this.gameDuration / 1000);

          this.wiggleSmall = { amplitude: 0.5, frequency: 5 };
          this.wiggleLarge = { amplitude: 1.25, frequency: 1 };

          this.initCars();
          this.loadImages();
          this.setupResizeObserver();
        }

        updateCanvasSize() {
          const rect = this.canvas.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;

          this.canvas.width = rect.width * dpr;
          this.canvas.height = rect.height * dpr;

          this.ctx.scale(dpr, dpr);

          this.width = rect.width;
          this.height = rect.height;
        }

        setupResizeObserver() {
          const resizeObserver = new ResizeObserver(() => {
            this.updateCanvasSize();

            this.roadLineWidth = (20 / 600) * this.height;
            this.roadLineHeight = this.height;
            this.carHeight = this.height / 4;
            this.carSplashHeight = this.height / 12;
            this.carSpeed = this.height / (this.gameDuration / 1000);
          });

          resizeObserver.observe(this.canvas);
        }

        loadImages() {
          this.images = {};
          const imageNames = [
            "road_line",
            "car_green",
            "car_yellow",
            "car_blue",
            "car_white",
            "car_orange",
            "car_splash",
          ];

          let loadedCount = 0;
          imageNames.forEach((name) => {
            const img = new Image();
            img.onload = () => {
              loadedCount++;
              if (loadedCount === imageNames.length) {
                this.startGame();
              }
            };
            const extension = name === "road_line" ? "jpg" : "png";
            img.src = `assets/${name}.${extension}`;
            this.images[name] = img;
          });
        }

        initCars() {
          this.cars.push({
            type: "car_yellow",
            lane: "right",
            x: this.width * 0.785,
            y: this.height + this.height / 6,
            targetY: -this.carHeight - this.height / 12,
            wiggleX: 0,
            wiggleY: 0,
            wigglePhase: Math.random() * Math.PI * 2,
            startTime: 250,
            duration: 1750,
            reverseDelay: 1250,
          });

          this.cars.push({
            type: "car_green",
            lane: "left",
            x: this.width * 0.215,
            y: this.height + this.height / 6,
            targetY: -this.carHeight - this.height / 12,
            wiggleX: 0,
            wiggleY: 0,
            wigglePhase: Math.random() * Math.PI * 2,
            startTime: 1250,
            duration: 1500,
            reverseDelay: 750,
          });

          this.cars.push({
            type: "car_blue",
            lane: "right",
            x: this.width * 0.785,
            y: this.height + this.height / 6,
            targetY: -this.carHeight - this.height / 12,
            wiggleX: 0,
            wiggleY: 0,
            wigglePhase: Math.random() * Math.PI * 2,
            startTime: 2000,
            duration: 1000,
            reverseDelay: 500,
          });

          this.cars.push({
            type: "car_white",
            nextType: "car_orange",
            lane: "center",
            x: this.width * 0.5,
            y: this.height * 0.625,
            targetY: this.height * 0.5,
            wiggleX: 0,
            wiggleY: 0,
            wigglePhase: Math.random() * Math.PI * 2,
            isStatic: true,
            transitionProgress: 0,
            isTransitioning: false,
          });

          const mainCarWigglePhase =
            this.cars[this.cars.length - 1].wigglePhase;

          this.cars.push({
            type: "car_splash",
            lane: "center",
            x: this.width * 0.5,
            y: this.height * 0.625 + this.height / 8 + this.height / 60,
            wiggleX: 0,
            wiggleY: 0,
            wigglePhase: mainCarWigglePhase,
            isStatic: true,
            isSplash: true,
            opacity: 0,
            isVisible: false,
          });
        }

        updateWiggle(car, deltaTime) {
          const time = Date.now() / 1000;

          car.wiggleY =
            Math.sin(
              time * this.wiggleSmall.frequency * Math.PI * 2 + car.wigglePhase
            ) * this.wiggleSmall.amplitude;

          car.wiggleX =
            Math.sin(
              time * this.wiggleLarge.frequency * Math.PI * 2 + car.wigglePhase
            ) * this.wiggleLarge.amplitude;
        }

        updateCars(deltaTime) {
          const elapsed = Date.now() - this.startTime;

          this.cars.forEach((car) => {
            this.updateWiggle(car, deltaTime);

            if (!car.isStatic) {
              if (elapsed >= car.startTime) {
                const carElapsed = elapsed - car.startTime;
                const progress = Math.min(carElapsed / car.duration, 1);

                const startY = this.height + this.height / 12;
                const endY = -this.carHeight - this.height / 12;
                car.y = startY + (endY - startY) * progress;
              }
            }
          });
        }

        updateRoadLines(deltaTime) {
          this.roadLineOffset += this.roadLineSpeed;
          if (this.roadLineOffset >= this.roadLineHeight) {
            this.roadLineOffset = 0;
          }
        }

        drawRoadLines() {
          for (
            let y = this.roadLineOffset - this.roadLineHeight;
            y < this.height + this.roadLineHeight;
            y += this.roadLineHeight
          ) {
            this.ctx.drawImage(
              this.images.road_line,
              0,
              y,
              this.roadLineWidth,
              this.roadLineHeight
            );
          }

          for (
            let y = this.roadLineOffset - this.roadLineHeight;
            y < this.height + this.roadLineHeight;
            y += this.roadLineHeight
          ) {
            this.ctx.drawImage(
              this.images.road_line,
              this.width - this.roadLineWidth,
              y,
              this.roadLineWidth,
              this.roadLineHeight
            );
          }
        }

        drawCars() {
          this.cars.forEach((car) => {
            if (!car.isSplash || !car.isVisible) return;

            const img = this.images[car.type];
            if (img && img.naturalHeight) {
              const desiredHeight = this.carSplashHeight;
              const scale = desiredHeight / img.naturalHeight;
              const drawWidth = img.naturalWidth * scale;
              const drawHeight = img.naturalHeight * scale;
              const drawX = car.x - drawWidth / 2 + car.wiggleX;
              const drawY = car.y - drawHeight / 2 + car.wiggleY;

              this.ctx.save();
              this.ctx.globalAlpha = car.opacity || 1;
              this.ctx.drawImage(img, drawX, drawY, drawWidth, drawHeight);
              this.ctx.restore();
            }
          });

          this.cars.forEach((car) => {
            if (car.isSplash) return;

            if (car.isTransitioning && car.nextType) {
              const currentImg = this.images[car.type];
              const nextImg = this.images[car.nextType];

              if (currentImg && nextImg) {
                this.ctx.save();
                this.ctx.globalAlpha = 1 - car.transitionProgress;
                if (currentImg.naturalHeight) {
                  const desiredHeight = this.carHeight;
                  const scale = desiredHeight / currentImg.naturalHeight;
                  const drawWidth = currentImg.naturalWidth * scale;
                  const drawHeight = currentImg.naturalHeight * scale;
                  const drawX = car.x - drawWidth / 2 + car.wiggleX;
                  const drawY = car.y - drawHeight / 2 + car.wiggleY;
                  this.ctx.drawImage(
                    currentImg,
                    drawX,
                    drawY,
                    drawWidth,
                    drawHeight
                  );
                }
                this.ctx.restore();

                this.ctx.save();
                this.ctx.globalAlpha = car.transitionProgress;
                if (nextImg.naturalHeight) {
                  const desiredHeight = this.carHeight;
                  const scale = desiredHeight / nextImg.naturalHeight;
                  const drawWidth = nextImg.naturalWidth * scale;
                  const drawHeight = nextImg.naturalHeight * scale;
                  const drawX = car.x - drawWidth / 2 + car.wiggleX;
                  const drawY = car.y - drawHeight / 2 + car.wiggleY;
                  this.ctx.drawImage(
                    nextImg,
                    drawX,
                    drawY,
                    drawWidth,
                    drawHeight
                  );
                }
                this.ctx.restore();
              }
            } else {
              const img = this.images[car.type];
              if (img && img.naturalHeight) {
                const desiredHeight = this.carHeight;
                const scale = desiredHeight / img.naturalHeight;
                const drawWidth = img.naturalWidth * scale;
                const drawHeight = img.naturalHeight * scale;
                const drawX = car.x - drawWidth / 2 + car.wiggleX;
                const drawY = car.y - drawHeight / 2 + car.wiggleY;
                this.ctx.drawImage(img, drawX, drawY, drawWidth, drawHeight);
              }
            }
          });
        }

        update() {
          const deltaTime = 16;

          this.updateRoadLines(deltaTime);
          this.updateCars(deltaTime);
          this.updateReverseAnimation();
          this.updateCarTransition();
          this.updateSpeedAnimation();
          this.updateSplashAnimation();
        }

        draw() {
          this.ctx.clearRect(0, 0, this.width, this.height);

          this.drawRoadLines();

          this.drawCars();
        }

        gameLoop() {
          if (this.isGameActive) {
            this.update();
            this.draw();
            requestAnimationFrame(() => this.gameLoop());
          }
        }

        startGame() {
          this.gameLoop();
        }

        stopGame() {
          this.isGameActive = false;
        }

        startReverseAnimation() {
          this.reverseAnimationStartTime = Date.now();
          this.isReverseActive = true;
        }

        startCarTransition() {
          const staticCar = this.cars.find((car) => car.isStatic);
          if (staticCar && staticCar.nextType) {
            staticCar.isTransitioning = true;
            staticCar.transitionStartTime = Date.now();

            const splashCar = this.cars.find((car) => car.isSplash);
            if (splashCar) {
              setTimeout(() => {
                this.animatePosition(
                  staticCar,
                  this.height * 0.625,
                  this.height * 0.825,
                  1000
                );
                this.animatePosition(
                  splashCar,
                  this.height * 0.625 + this.height / 8 + this.height / 60,
                  this.height * 0.825 + this.height / 8 + this.height / 60,
                  1000
                );
              }, 2500);
            }
          }
        }

        animatePosition(car, startY, endY, duration) {
          const startTime = Date.now();

          const animate = () => {
            const elapsed = Date.now() - startTime;
            const progress = Math.min(elapsed / duration, 1);

            const easeInOut =
              progress < 0.5
                ? 2 * progress * progress
                : 1 - Math.pow(-2 * progress + 2, 2) / 2;

            car.y = startY + (endY - startY) * easeInOut;

            if (progress < 1) {
              requestAnimationFrame(animate);
            }
          };

          animate();
        }

        updateCarTransition() {
          const staticCar = this.cars.find((car) => car.isStatic);
          if (staticCar && staticCar.isTransitioning) {
            const elapsed = Date.now() - staticCar.transitionStartTime;
            const transitionDuration = 1000;

            staticCar.transitionProgress = Math.min(
              elapsed / transitionDuration,
              1
            );

            if (staticCar.transitionProgress >= 1) {
              staticCar.type = staticCar.nextType;
              staticCar.isTransitioning = false;
              staticCar.transitionProgress = 0;
            }
          }
        }

        startSpeedAnimation() {
          this.isSpeedAnimating = true;
          this.speedAnimationStartTime = Date.now();
        }

        updateSpeedAnimation() {
          if (!this.isSpeedAnimating) return;

          const elapsed = Date.now() - this.speedAnimationStartTime;
          const speedDuration = 1000;

          const progress = Math.min(elapsed / speedDuration, 1);
          this.roadLineSpeed =
            this.initialSpeed +
            (this.targetSpeed - this.initialSpeed) * progress;

          if (progress >= 1) {
            this.isSpeedAnimating = false;
          }
        }

        startSplashAnimation() {
          const splashCar = this.cars.find((car) => car.isSplash);
          if (splashCar) {
            splashCar.isVisible = true;
            splashCar.splashStartTime = Date.now();
          }
        }

        updateSplashAnimation() {
          const splashCar = this.cars.find((car) => car.isSplash);
          if (splashCar && splashCar.isVisible) {
            const elapsed = Date.now() - splashCar.splashStartTime;
            const splashDuration = 1000;

            splashCar.opacity = Math.min(elapsed / splashDuration, 1);
          }
        }

        updateReverseAnimation() {
          if (!this.isReverseActive) return;

          const elapsed = Date.now() - this.reverseAnimationStartTime;
          const reverseDuration = 1250;

          this.cars.forEach((car) => {
            if (!car.isStatic && car.reverseDelay !== undefined) {
              const carElapsed = elapsed - car.reverseDelay;

              if (carElapsed >= 0 && carElapsed <= reverseDuration) {
                const progress = carElapsed / reverseDuration;
                const startY = -this.carHeight - this.height / 12;
                const endY = this.height + this.height / 12;
                car.y = startY + (endY - startY) * progress;
              }
            }
          });

          if (elapsed >= 2500) {
            this.isReverseActive = false;
          }
        }
      }

      let game;
      window.addEventListener("load", () => {
        game = new CanvasGame();
      });

      function addClassWithDelay(element, className, delay) {
        setTimeout(() => {
          element.classList.add(className);
        }, delay);
      }

      function removeClassWithDelay(element, className, delay) {
        setTimeout(() => {
          element.classList.remove(className);
        }, delay);
      }

      window.addEventListener("load", () => {
        const text1 = document.getElementById("text1");
        const text2 = document.getElementById("text2");
        const fuelGun = document.getElementById("fuelGun");
        const logoColor = document.getElementById("logoColor");
        const divider = document.getElementById("divider");
        const clickerArea = document.getElementById("clickerArea");
        const clicker = document.getElementById("clicker");
        const dividerColor = document.getElementById("dividerColor");
        const packshot = document.getElementById("packshot");
        const logoWhite = document.getElementById("logoWhite");
        const text3 = document.getElementById("text3");
        const button = document.getElementById("button");

        let clickCount = 0;
        const maxClicks = 4;

        function triggerNextAnimations() {
          addClassWithDelay(divider, "divider-disappear", 0);
          addClassWithDelay(fuelGun, "fuel-gun-disappear", 0);
          removeClassWithDelay(clicker, "clicker-appear", 0);

          game.startReverseAnimation();

          game.startCarTransition();

          game.startSpeedAnimation();

          game.startSplashAnimation();

          setTimeout(() => {
            addClassWithDelay(packshot, "packshot-appear", 0);
            addClassWithDelay(packshot, "packshot-reveal", 500);
            addClassWithDelay(text3, "text-appear", 500);
            addClassWithDelay(button, "button-appear", 1750);
          }, 2000);
        }

        clickerArea.addEventListener("click", () => {
          if (clickCount < maxClicks) {
            clickCount++;

            dividerColor.classList.remove(
              "divider-color-25",
              "divider-color-50",
              "divider-color-75",
              "divider-color-100"
            );

            switch (clickCount) {
              case 1:
                dividerColor.classList.add("divider-color-25");
                break;
              case 2:
                dividerColor.classList.add("divider-color-50");
                break;
              case 3:
                dividerColor.classList.add("divider-color-75");
                break;
              case 4:
                dividerColor.classList.add("divider-color-100");
                setTimeout(triggerNextAnimations, 500);
                break;
            }
          }
        });

        addClassWithDelay(text1, "text-appear", 0);
        addClassWithDelay(text1, "text-disappear", 2500);

        setTimeout(() => {
          addClassWithDelay(text2, "text-appear", 0);
          addClassWithDelay(clickerArea, "clicker-area-appear", 0);
          addClassWithDelay(fuelGun, "fuel-gun-appear", 750);
          addClassWithDelay(clicker, "clicker-appear", 750);
          addClassWithDelay(logoColor, "logo-appear", 0);
          addClassWithDelay(text2, "text-disappear-scale", 2000);
        }, 3000);

        setTimeout(() => {
          addClassWithDelay(divider, "divider-appear", 0);

          setTimeout(() => {
            if (clickCount < maxClicks) {
              dividerColor.classList.add("divider-color-100");
              setTimeout(triggerNextAnimations, 500);
            }
          }, 4750);

          if (clickCount < maxClicks) {
            addClassWithDelay(divider, "divider-disappear", 5750);
            addClassWithDelay(fuelGun, "fuel-gun-disappear", 5750);
            removeClassWithDelay(clicker, "clicker-appear", 5750);
          }
        }, 5750);

        setTimeout(() => {
          if (clickCount < maxClicks) {
            addClassWithDelay(packshot, "packshot-appear", 0);
            addClassWithDelay(packshot, "packshot-reveal", 500);
            addClassWithDelay(text3, "text-appear", 500);
            addClassWithDelay(button, "button-appear", 1750);
          }
        }, 13500);
      });
    </script>
  </body>
</html>
