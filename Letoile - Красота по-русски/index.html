<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.size" content="width=300,height=600">
    <title>Banner 300x600</title>
    <link rel="stylesheet" href="assets/styles.css">
    <script>
        var clickTag = "https://www.letu.ru/promo/16020028";
    </script>
</head>
<body>
    <div class="banner-container">
        <img src="assets/background_image.jpg" class="background-image">
        <img src="assets/background.jpg" class="background">
        <div class="shade"></div>
        <img src="assets/logo.svg" class="logo">
        <div class="text">
            <img src="assets/header_1.svg">
            <img src="assets/header_2.svg" class="header-2">
            <img src="assets/tagline.svg">
        </div>
        <img src="assets/blush_close.png" class="blush-close">
        <img src="assets/blush_open.png" class="blush-open">
        <a href="javascript:void(window.open(window.clickTag))">
            <img src="assets/button_plate.svg" class="button-plate">
        </a>
        <img src="assets/glitter.png" class="glitter-blush glitter-blush-left">
        <img src="assets/glitter.png" class="glitter-blush glitter-blush-right">
        <div class="girl">
            <img src="assets/kokoshnik_glow.png" class="kokoshnik kokoshnik-glow">
            <img src="assets/kokoshnik_front.png" class="kokoshnik kokoshnik-front">
            <img src="assets/girl_no_make_up.png" class="girl-no-makeup">
            <img src="assets/girl_make_up.png" class="girl-makeup">
            <img src="assets/kokoshnik_back.png" class="kokoshnik kokoshnik-back">
        </div>
        <img src="assets/glitter.png" class="glitter glitter-left">
        <img src="assets/glitter.png" class="glitter glitter-right">
        <div class="clicker">
            <div class="hint-cursor">
                <img src="assets/hint_cursor_1.svg">
                <img src="assets/hint_cursor_2.svg">
                <img src="assets/hint_cursor_3.svg">
            </div>
            <img src="assets/hint_text.svg" class="hint-text">
        </div>
    </div>
    <script src="assets/index.js"></script>
</body>
</html>
