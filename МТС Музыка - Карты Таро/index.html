<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MTS Music Banner</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>

<body>
    <div class="container">
        <img class="big-image" src="assets/background.jpg" alt="Big Image">
        <img class="small-image" src="assets/deck.png" alt="Small Image">
        <div class="text-overlay">
            Вытяни карту и узнай, что тебя ждёт сегодня
        </div>
    </div>

    <div class="blur-overlay"></div>
    <img class="card-display" src="" alt="Card">

    <div class="packshot">
        <img class="round-big" src="assets/round_big.png" alt="Round Big">
        <img class="round-small" src="assets/round_small.png" alt="Round Small">
        <div class="packshot-text">
            <div class="music-text">Слушай музыку</div>
            <div class="mood-text">под любое настроение</div>
            <div class="download-button">Скачать приложение</div>
        </div>
    </div>

    <script src="assets/script.js"></script>
</body>

</html>
