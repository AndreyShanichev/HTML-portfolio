        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: var(--banner-width);
            height: var(--banner-height);
            border: 1px solid #000;
            position: relative;
            font-family: 'Golos Text', Arial, sans-serif;
        }

        #banner {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            overflow: hidden;
        }

        #background {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: calc(var(--banner-vmax) * var(--background-scale));
            height: calc(var(--banner-vmax) * var(--background-scale));
            object-fit: cover;
        }

        #logo {
            position: absolute;
            top: var(--logo-top);
            left: var(--logo-left);
            transform: var(--logo-transform);
            width: var(--logo-width);
            height: auto;
        }

        .header,
        .subheader,
        .cashback,
        .button {
            position: absolute;
            top: var(--header-top);
            left: var(--header-left);
            transform: var(--header-transform);
            font-size: var(--header-font-size);
            color: white;
            text-align: center;
            text-transform: uppercase;
            text-wrap: nowrap;
            line-height: 1;
            visibility: hidden;
        }

        #header_4 {
            top: calc(var(--header-top) - 5%);
        }

        .header.visible,
        .subheader.visible,
        .checkbox-text.visible {
            visibility: visible;
        }

        .header .line-wrapper,
        .subheader .line-wrapper,
        .checkbox-text .line-wrapper {
            display: block;
        }

        .header .line,
        .subheader .line,
        .checkbox-text .line {
            display: block;
            transform: translateY(125%);
            opacity: 0;
        }

        .header .line.animate,
        .subheader .line.animate,
        .checkbox-text .line.animate {
            animation: textLineAppear 0.75s cubic-bezier(0.2, 0, 0.1, 1) forwards;
        }

        .header .line.animate-out,
        .subheader .line.animate-out,
        .checkbox-text .line.animate-out {
            animation: textLineDisappear 0.5s cubic-bezier(0.9, 0, 0.8, 1) forwards;
        }

        @keyframes textLineAppear {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes textLineDisappear {
            from {
                transform: translateY(0);
                opacity: 1;
            }

            to {
                transform: translateY(-100%);
                opacity: 0;
            }
        }

        .text-container {
            display: flex;
            position: absolute;
            top: var(--header-top);
            left: var(--header-left);
            transform: var(--header-transform);
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .text-container .header {
            position: relative;
            top: 0;
            left: 0;
            transform: none;
        }

        .text-container .subheader {
            position: relative;
            font-size: var(--subheader-font-size);
            top: 0;
            left: 0;
            transform: none;
            margin-top: var(--subheader-margin-top);
        }

        .content {
            position: absolute;
            top: var(--content-top);
            left: var(--content-left);
            width: calc(var(--banner-vmin) * var(--content-scale));
            height: calc(var(--banner-vmin) * var(--content-scale));
            opacity: 0;
            transform: var(--content-transform) scale(0.75);
            animation: contentAppear 0.75s cubic-bezier(0.2, 0, 0.1, 1) 0.25s forwards;
            transition: height 1s cubic-bezier(0.2, 0, 0.1, 1);
        }

        @keyframes contentAppear {
            to {
                opacity: 1;
                transform: var(--content-transform) scale(1);
            }
        }

        .content.close {
            height: calc(var(--banner-vmin) * var(--content-scale) / 2);
        }

        .checkboxes {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: white;
            border-radius: calc(var(--banner-vmin) * var(--checkboxes-border-radius));
            transition: height 1s cubic-bezier(0.2, 0, 0.1, 1);
        }

        .checkboxes.close {
            height: 50%;
        }

        .checkboxes.close.disappear {
            animation: checkboxesDisappear 1s cubic-bezier(0.9, 0, 0.8, 1) forwards;
        }

        @keyframes checkboxesDisappear {
            from {
                opacity: 1;
                transform: scale(1);
            }

            to {
                opacity: 0;
                transform: scale(0.75);
            }
        }

        .checkbox {
            position: absolute;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            cursor: pointer;
        }

        #checkbox_main {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            transform: translate(-50%, -50%) scale(1);
        }

        #checkbox_main.disappear {
            animation: checkboxDisappear 0.75s cubic-bezier(0.9, 0, 0.8, 1) forwards;
        }

        @keyframes checkboxDisappear {
            from {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }

            to {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.75);
                display: none;
            }
        }

        #checkbox_1 {
            top: 20%;
            opacity: 0;
            transform: translateY(-50%) scale(0.75);
            visibility: hidden;
        }

        #checkbox_2 {
            opacity: 0;
            transform: scale(0.75);
            visibility: hidden;
        }

        #checkbox_3 {
            top: 80%;
            opacity: 0;
            transform: translateY(-50%) scale(0.75);
            visibility: hidden;
        }

<body>
    <div class="banner" id="banner">

            <div class="checkboxes">

    <script>
        function animateTextLines(element, delayBetweenLines = 250, initialDelay = 0, direction = 'in') {
            if (!element) return;

            if (!element.dataset.processed) {
                const html = element.innerHTML;
                const lines = html.split('<br>').filter(line => line.trim() !== '');

                element.innerHTML = '';

                lines.forEach((lineText, index) => {
                    const wrapper = document.createElement('span');
                    wrapper.className = 'line-wrapper';

                    const line = document.createElement('span');
                    line.className = 'line';
                    line.textContent = lineText.trim();

                    wrapper.appendChild(line);
                    element.appendChild(wrapper);
                });

                element.dataset.processed = 'true';
            }

            if (direction === 'in') {
                element.classList.add('visible');
            }

            const lines = element.querySelectorAll('.line');

            lines.forEach((line, index) => {
                setTimeout(() => {
                    if (direction === 'in') {
                        line.classList.remove('animate-out');
                        line.classList.add('animate');
                    } else if (direction === 'out') {
                        line.classList.remove('animate');
                        line.classList.add('animate-out');
                    }
                }, initialDelay + index * delayBetweenLines);
            });
        }

        function wiggleElement(element, amplitude, frequency, start) {
            if (!element) return;

            const fadeInDuration = 500;
            let animationId = null;
            const startTime = performance.now();

            function animate(currentTime) {
                const elapsed = currentTime - startTime;

                if (elapsed < start) {
                    animationId = requestAnimationFrame(animate);
                    return;
                }

                const localElapsed = elapsed - start;
                let wiggleIntensity = 0;

                if (localElapsed < fadeInDuration) {
                    wiggleIntensity = localElapsed / fadeInDuration;
                } else {
                    wiggleIntensity = 1;
                }

                const wiggleTime = localElapsed / 1000 * frequency;
                const y = Math.sin(wiggleTime * Math.PI * 2) * amplitude * wiggleIntensity;

                element.style.translate = `0 ${y}px`;

                animationId = requestAnimationFrame(animate);
            }

            animationId = requestAnimationFrame(animate);

            return () => {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    element.style.translate = '0 0';
                }
            };
        }

        document.addEventListener('DOMContentLoaded', function () {
            const header1 = document.getElementById('header_1');
            const header2 = document.getElementById('header_2');
            const header3 = document.getElementById('header_3');
            const header4 = document.getElementById('header_4');
            const subheader = document.getElementById('subheader');
            const checkboxText1 = document.getElementById('checkbox_text_1');
            const lipstick = document.getElementById('lipstick');
            const airplane = document.getElementById('airplane');
            const content = document.querySelector('.content');
            const checkboxes = document.querySelector('.checkboxes');
            const checkboxMain = document.getElementById('checkbox_main');
            const checkbox1 = document.getElementById('checkbox_1');
            const checkbox2 = document.getElementById('checkbox_2');
            const checkbox3 = document.getElementById('checkbox_3');
            const marker1 = document.getElementById('marker_1');
            const marker2 = document.getElementById('marker_2');
            const marker3 = document.getElementById('marker_3');
            const packshot = document.querySelector('.packshot');
            const cashback = document.querySelector('.cashback');
            const button = document.querySelector('.button');
            const lipstickPackshot = document.getElementById('lipstick-packshot');
            const tube = document.getElementById('tube');

            let selectedCheckbox = null;

            function handleCheckboxClick(clickedCheckbox, clickedMarker) {
                if (selectedCheckbox) return;

                selectedCheckbox = clickedCheckbox;
                clickedMarker.classList.add('reveal');

                setTimeout(() => {
                    if (checkbox1 !== clickedCheckbox) {
                        checkbox1.classList.add('disappear');
                    }
                    if (checkbox2 !== clickedCheckbox) {
                        checkbox2.classList.add('disappear');
                    }
                    if (checkbox3 !== clickedCheckbox) {
                        checkbox3.classList.add('disappear');
                    }
                    lipstick.classList.add('disappear');
                }, 500);

                setTimeout(() => {
                    clickedCheckbox.classList.add('selected');
                    checkboxes.classList.add('close');
                    animateTextLines(header2, 250, 0, 'out');
                    animateTextLines(header3, 250, 750, 'in');
                    animateTextLines(subheader, 250, 1250, 'in');

                    setTimeout(() => {
                        airplane.classList.add('appear');
                        wiggleElement(airplane, 10, 0.25, 750);
                    }, 500);
                }, 1250);

                setTimeout(() => {
                    animateTextLines(header3, 250, 0, 'out');
                    animateTextLines(subheader, 250, 500, 'out');
                    animateTextLines(header4, 250, 1000, 'in');
                    airplane.classList.add('disappear');
                    checkboxes.classList.add('disappear');

                    setTimeout(() => {
                        packshot.classList.add('appear');
                        cashback.classList.add('appear');

                        setTimeout(() => {
                            button.classList.add('appear');

                            tube.classList.add('appear');
                            setTimeout(() => {
                                wiggleElement(tube, 10, 0.25, 0);
                            }, 750);

                            setTimeout(() => {
                                lipstickPackshot.classList.add('appear');
                                setTimeout(() => {
                                    wiggleElement(lipstickPackshot, 5, 0.25, 0);
                                }, 1000);
                            }, 250);
                        }, 250);
                    }, 1500);
                }, 5000);
            }

            checkbox1.addEventListener('click', function () {
                handleCheckboxClick(checkbox1, marker1);
            });

            checkbox2.addEventListener('click', function () {
                handleCheckboxClick(checkbox2, marker2);
            });

            checkbox3.addEventListener('click', function () {
                handleCheckboxClick(checkbox3, marker3);
            });

            animateTextLines(header1, 250, 0, 'in');
            animateTextLines(checkboxText1, 250, 500, 'in');
            wiggleElement(lipstick, 10, 0.25, 2000);

            setTimeout(() => {
                animateTextLines(header1, 250, 0, 'out');
                animateTextLines(header2, 250, 750, 'in');
                checkboxMain.classList.add('disappear');
                lipstick.classList.add('move');

                setTimeout(() => {
                    content.classList.remove('close');

                    setTimeout(() => {
                        checkbox1.classList.add('appear');
                    }, 250);

                    setTimeout(() => {
                        checkbox2.classList.add('appear');
                    }, 500);

                    setTimeout(() => {
                        checkbox3.classList.add('appear');
                    }, 750);

                }, 500);

            }, 4000);

            setTimeout(() => {
                if (!selectedCheckbox) {
                    const randomCheckboxes = [checkbox1, checkbox2, checkbox3];
                    const randomMarkers = [marker1, marker2, marker3];
                    const randomIndex = Math.floor(Math.random() * 3);

                    const randomCheckbox = randomCheckboxes[randomIndex];
                    const randomMarker = randomMarkers[randomIndex];

                    handleCheckboxClick(randomCheckbox, randomMarker);
                }
            }, 12500);
        });
    </script>
